name: Build esptool-js

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build-esptool.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build esptool-js
        run: npm run build

      - name: Show generated files
        run: |
          echo "生成されたファイル:"
          find dist -maxdepth 2 -type f | sort

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist

          if git diff --cached --quiet; then
            echo "distに変更はありません"
          else
            git commit -m "Build esptool-js dist"
            git push
          fi
