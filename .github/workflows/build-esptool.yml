name: Build esptool-js

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "esptool-js/**"
      - ".github/workflows/build-esptool.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: esptool-js/package-lock.json

      - name: Install dependencies
        working-directory: esptool-js
        run: npm ci

      - name: Build esptool-js library
        working-directory: esptool-js
        run: npm run build

      - name: Build TypeScript example
        working-directory: esptool-js/examples/typescript
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add esptool-js/examples/typescript/dist

          if git diff --cached --quiet; then
            echo "distに変更はありません"
          else
            git commit -m "Build esptool-js dist"
            git push
          fi
